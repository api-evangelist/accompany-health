  detail: >-
    Accompany Health is a value-based care-delivery organization, not a software
    vendor — its entire public surface is a 27-page WordPress marketing site whose
    "For Providers" page routes referring clinicians to a web contact form rather than
    to any partner API, and the only machine-readable HTTP surface on the domain is
    the default WordPress core REST API at /wp-json/, which is CMS infrastructure
    WordPress ships with every install and not an API this company designed,
    documents or supports.
