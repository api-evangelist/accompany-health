name: Accompany Health
description: 'Accompany Health is a value-based healthcare company that delivers integrated
  in-home and virtual care to patients with complex, chronic conditions, primarily those
  covered by Medicaid and Medicare. Its multidisciplinary care teams combine primary care,
  behavioral health, and social care, wrapping medical treatment with support for the
  social drivers of health. The company operates in Massachusetts, Michigan (Detroit),
  and Colorado (Denver), works with health plans and providers, and is HIPAA compliant.
  It was surfaced as a portfolio company of IVP and profiled in the API Evangelist network;
  it publishes a marketing and patient-education website but no public developer/API surface.'
